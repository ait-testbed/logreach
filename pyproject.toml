[project]
name = "logreach"
description = "Filter logfiles by timestamp and detect the log type of files in a directory"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "python-dateutil>=2.9.0.post0",
    "rich>=15.0.0",
]

dynamic = ["version"]

[project.scripts]
logreach = "logreach.__main__:main"

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "logreach.metadata.__version__"}

[tool.isort]
line_length = 110
src_paths = ["src", "tests"]

[tool.mypy]
explicit_package_bases = true

[dependency-groups]
dev = [
    "prek>=0.4.3",
    "pytest>=9.1.0"
]
docs = [
    "mike>=2.2.0",
    "pymdown-extensions>=10.0",
]
